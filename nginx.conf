server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify/Traefik termina TLS delante de este contenedor — aquí solo HTTP plano.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # robots.txt/sitemap.xml cambian de contenido en el lanzamiento — no cachear fuerte
    location = /robots.txt {
        add_header Cache-Control "no-cache";
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS ya llevan cache-busting manual (?v=NN) en el HTML — cache larga es segura
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:jpg|jpeg|png|svg|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # Range requests habilitados (default en nginx) — necesario para que el <video> pueda buscar/saltar
    location ~* \.(?:mp4|webm)$ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
